# Entorno de operación: requiere esquema preparado; no modifica su estructura.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.thymeleaf.cache=true
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
management.server.address=127.0.0.1
management.server.port=${MANAGEMENT_PORT:8081}
logging.structured.format.file=ecs
logging.level.root=INFO
logging.level.pe.com.honoriaexpress.stockflow=INFO
