spring.application.name=StockFlow
app.agencia.cuota=10.00

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/stockflow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Logback: registros locales con rotación; no se versionan datos operativos.
logging.file.name=${STOCKFLOW_LOG_FILE:logs/stockflow.log}
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=100MB
