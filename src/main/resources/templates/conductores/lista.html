<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Conductores | StockFlow</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"></head>
<body><div class="layout"><aside th:replace="~{fragments/sidebar :: sidebar('conductores')}"></aside><main class="main-content"><header class="topbar"><div><span class="eyebrow">Registros</span><h1>Conductores</h1></div><a class="primary-button" sec:authorize="hasAnyRole('ADMINISTRADOR','OPERATIVO')" th:href="@{/conductores/nuevo}">Nuevo conductor</a></header><div class="success-message" role="status" th:if="${mensajeExito}" th:text="${mensajeExito}"></div><section class="panel"><div class="section-heading"><h2>Listado</h2><span class="muted" th:text="${#lists.size(conductores) + ' registro(s)'}"></span></div><div class="table-responsive"><table class="data-table"><thead><tr><th>Conductor</th><th>DNI</th><th>Licencia</th><th>Teléfono</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="conductor : ${conductores}"><td data-label="Conductor" th:text="${conductor.nombres + ' ' + conductor.apellidos}"></td><td data-label="DNI" th:text="${conductor.dni}"></td><td data-label="Licencia"><span th:text="${conductor.licencia}"></span><small th:text="${conductor.fechaVencimientoLicencia != null ? 'Vence ' + #temporals.format(conductor.fechaVencimientoLicencia, 'dd/MM/yyyy') : 'Sin vencimiento registrado'}"></small></td><td data-label="Teléfono" th:text="${#strings.isEmpty(conductor.telefono) ? '—' : conductor.telefono}"></td><td data-label="Estado"><span class="status-badge" th:classappend="${conductor.activo ? 'status-active' : 'status-muted'}" th:text="${conductor.activo ? 'Activo' : 'Inactivo'}"></span></td>
<td data-label="Acciones"><div class="action-buttons" sec:authorize="hasAnyRole('ADMINISTRADOR','OPERATIVO')"><a class="secondary-button" th:href="@{/conductores/editar/{id}(id=${conductor.id})}">Editar</a><form method="post" th:action="@{/conductores/estado/{id}(id=${conductor.id})}" data-confirmar-estado="¿Confirma el cambio de estado de este registro?"><button type="submit" th:class="${conductor.activo ? 'danger-button' : 'success-button'}" th:text="${conductor.activo ? 'Inactivar' : 'Activar'}"></button></form></div></td></tr>
<tr th:if="${#lists.isEmpty(conductores)}"><td colspan="6">Aún no hay registros.</td></tr></tbody></table></div></section></main></div></body></html>
