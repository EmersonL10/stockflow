<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Conductores | StockFlow</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"></head>
<body><div class="layout"><aside th:replace="~{fragments/sidebar :: sidebar('conductores')}"></aside><main class="main-content form-page"><header class="topbar"><div><span class="eyebrow">Registros / Conductores</span><h1 th:text="${conductor.id == null ? 'Nuevo conductor' : 'Editar conductor'}"></h1></div><a class="text-link" th:href="@{/conductores}">Volver al listado</a></header>
<section class="panel"><form class="stack-form" th:action="@{/conductores/guardar}" th:object="${conductor}" method="post"><input type="hidden" th:field="*{id}"><input type="hidden" th:field="*{activo}">
<div class="error-message" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p></div><fieldset class="form-section"><legend><span class="step-number">1</span>Datos personales</legend><div class="field-grid"><div><label for="dni">DNI</label><input id="dni" type="text" th:field="*{dni}" maxlength="8" inputmode="numeric" required><span class="field-error" th:errors="*{dni}"></span></div><div><label for="nombres">Nombres</label><input id="nombres" type="text" th:field="*{nombres}" maxlength="100" required><span class="field-error" th:errors="*{nombres}"></span></div><div><label for="apellidos">Apellidos</label><input id="apellidos" type="text" th:field="*{apellidos}" maxlength="100" required><span class="field-error" th:errors="*{apellidos}"></span></div><div><label for="telefono">Teléfono (opcional)</label><input id="telefono" type="tel" th:field="*{telefono}" maxlength="9"><span class="field-error" th:errors="*{telefono}"></span></div></div></fieldset><fieldset class="form-section"><legend><span class="step-number">2</span>Licencia</legend><div class="field-grid"><div><label for="licencia">Número de licencia</label><input id="licencia" type="text" th:field="*{licencia}" maxlength="20" required><span class="field-error" th:errors="*{licencia}"></span></div><div><label for="fechaVencimientoLicencia">Vencimiento (opcional)</label><input id="fechaVencimientoLicencia" type="date" th:field="*{fechaVencimientoLicencia}" ><span class="field-error" th:errors="*{fechaVencimientoLicencia}"></span></div></div></fieldset><div class="form-actions"><a class="secondary-button" th:href="@{/conductores}">Cancelar</a><button class="primary-button" type="submit">Guardar conductor</button></div></form></section></main></div></body></html>
