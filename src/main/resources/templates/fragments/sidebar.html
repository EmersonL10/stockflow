<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside class="sidebar" th:fragment="sidebar(activePage)">
    <div class="brand"><a th:href="@{/}" class="brand-name">StockFlow</a><span>Honoria Express S.A.C.</span>
        <button class="menu-toggle" type="button" aria-expanded="true" aria-controls="navegacion-app">Menú</button></div>
    <div id="navegacion-app" class="nav-content">
        <nav class="menu" aria-label="Navegación principal">
            <a th:href="@{/}" th:attr="aria-current=${activePage == 'dashboard' ? 'page' : null}" th:classappend="${activePage == 'dashboard'} ? ' active' : ''">Inicio</a>
            <span class="nav-heading">Operación</span>
            <a th:href="@{/turnos}" th:attr="aria-current=${activePage == 'turnos' ? 'page' : null}" th:classappend="${activePage == 'turnos'} ? ' active' : ''">Turnos</a>
            <a th:href="@{/salidas}" th:attr="aria-current=${activePage == 'salidas' ? 'page' : null}" th:classappend="${activePage == 'salidas'} ? ' active' : ''">Salidas</a>
            <a th:href="@{/encomiendas}" sec:authorize="hasAnyRole('ADMINISTRADOR','OPERATIVO','CAJA')" th:attr="aria-current=${activePage == 'encomiendas' ? 'page' : null}" th:classappend="${activePage == 'encomiendas'} ? ' active' : ''">Encomiendas</a>
            <span class="nav-heading" sec:authorize="hasAnyRole('ADMINISTRADOR','CAJA')">Cobros</span>
            <a th:href="@{/caja}" sec:authorize="hasAnyRole('ADMINISTRADOR','CAJA')" th:attr="aria-current=${activePage == 'caja' ? 'page' : null}" th:classappend="${activePage == 'caja'} ? ' active' : ''">Caja</a>
            <a th:href="@{/reportes}" sec:authorize="hasAnyRole('ADMINISTRADOR','OPERATIVO','CAJA')" th:attr="aria-current=${activePage == 'reportes' ? 'page' : null}" th:classappend="${activePage == 'reportes'} ? ' active' : ''">Reportes</a>
            <span class="nav-heading">Registros</span>
            <a th:href="@{/conductores}" th:attr="aria-current=${activePage == 'conductores' ? 'page' : null}" th:classappend="${activePage == 'conductores'} ? ' active' : ''">Conductores</a>
            <a th:href="@{/vehiculos}" th:attr="aria-current=${activePage == 'vehiculos' ? 'page' : null}" th:classappend="${activePage == 'vehiculos'} ? ' active' : ''">Vehículos</a>
        </nav>
        <div class="sidebar-footer"><span class="user-caption">Tu sesión</span><strong sec:authentication="name">Usuario</strong>
            <form th:action="@{/logout}" method="post"><button type="submit" class="logout-button">Cerrar sesión</button></form></div>
    </div>
    <span id="diaOperativo" hidden th:attr="data-fecha=${hoyOperativo}"></span><script th:src="@{/js/navegacion.js}" defer></script>
</aside>
</body></html>
