<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${vehiculo.id == null
            ? 'Registrar vehículo | StockFlow'
            : 'Editar vehículo | StockFlow'}">

        Vehículo | StockFlow

    </title>

    <link rel="stylesheet"
          th:href="@{/css/dashboard.css}">
</head>

<body>

<div class="layout">

    <!-- =========================
         MENÚ LATERAL
         ========================= -->
    <aside class="sidebar">

        <div class="brand">
            <h2>StockFlow</h2>
            <span>Honoria Express S.A.C.</span>
        </div>

        <nav class="menu">

            <a th:href="@{/}">
                Dashboard
            </a>

            <a th:href="@{/conductores}">
                Conductores
            </a>

            <a th:href="@{/vehiculos}"
               class="active">
                Vehículos
            </a>

            <a href="#">
                Turnos
            </a>

            <a href="#">
                Salidas
            </a>

            <a href="#">
                Encomiendas
            </a>

            <a href="#">
                Caja
            </a>

            <a href="#">
                Reportes
            </a>

        </nav>

    </aside>


    <!-- =========================
         CONTENIDO PRINCIPAL
         ========================= -->
    <main class="main-content">

        <header class="topbar">

            <div>

                <h1 th:text="${vehiculo.id == null
                        ? 'Nuevo vehículo'
                        : 'Editar vehículo'}">
                    Vehículo
                </h1>

                <p th:text="${vehiculo.id == null
                        ? 'Registro de datos del vehículo'
                        : 'Actualización de datos del vehículo'}">

                    Gestión del vehículo

                </p>

            </div>

        </header>


        <!-- =========================
             FORMULARIO
             ========================= -->
        <section class="panel">

            <form th:action="@{/vehiculos/guardar}"
                  th:object="${vehiculo}"
                  method="post"
                  class="form-grid">


                <!-- =========================
                     DATOS OCULTOS
                     ========================= -->

                <input type="hidden"
                       th:field="*{id}">

                <input type="hidden"
                       th:field="*{activo}">


                <!-- =========================
                     PLACA
                     ========================= -->
                <div>

                    <label for="placa">
                        Placa
                    </label>

                    <input id="placa"
                           type="text"
                           th:field="*{placa}"
                           maxlength="10"
                           autocomplete="off">

                    <div class="field-error"
                         th:if="${#fields.hasErrors('placa')}"
                         th:errors="*{placa}">
                        Error placa
                    </div>

                </div>


                <!-- =========================
                     MARCA
                     ========================= -->
                <div>

                    <label for="marca">
                        Marca
                    </label>

                    <input id="marca"
                           type="text"
                           th:field="*{marca}"
                           maxlength="60"
                           autocomplete="off">

                    <div class="field-error"
                         th:if="${#fields.hasErrors('marca')}"
                         th:errors="*{marca}">
                        Error marca
                    </div>

                </div>


                <!-- =========================
                     MODELO
                     ========================= -->
                <div>

                    <label for="modelo">
                        Modelo
                    </label>

                    <input id="modelo"
                           type="text"
                           th:field="*{modelo}"
                           maxlength="60"
                           autocomplete="off">

                    <div class="field-error"
                         th:if="${#fields.hasErrors('modelo')}"
                         th:errors="*{modelo}">
                        Error modelo
                    </div>

                </div>


                <!-- =========================
                     AÑO
                     ========================= -->
                <div>

                    <label for="anio">
                        Año
                    </label>

                    <input id="anio"
                           type="number"
                           th:field="*{anio}"
                           min="1980"
                           max="2100">

                    <div class="field-error"
                         th:if="${#fields.hasErrors('anio')}"
                         th:errors="*{anio}">
                        Error año
                    </div>

                </div>


                <!-- =========================
                     COLOR
                     ========================= -->
                <div>

                    <label for="color">
                        Color
                    </label>

                    <input id="color"
                           type="text"
                           th:field="*{color}"
                           maxlength="40"
                           autocomplete="off">

                    <div class="field-error"
                         th:if="${#fields.hasErrors('color')}"
                         th:errors="*{color}">
                        Error color
                    </div>

                </div>


                <!-- =========================
                     CAPACIDAD
                     ========================= -->
                <div>

                    <label for="capacidadPasajeros">
                        Capacidad de pasajeros
                    </label>

                    <input id="capacidadPasajeros"
                           type="number"
                           th:field="*{capacidadPasajeros}"
                           min="1"
                           max="50">

                    <div class="field-error"
                         th:if="${#fields.hasErrors('capacidadPasajeros')}"
                         th:errors="*{capacidadPasajeros}">
                        Error capacidad
                    </div>

                </div>


                <!-- =========================
                     NÚMERO TUC
                     ========================= -->
                <div>

                    <label for="numeroTuc">
                        Número TUC
                    </label>

                    <input id="numeroTuc"
                           type="text"
                           th:field="*{numeroTuc}"
                           maxlength="30"
                           autocomplete="off">

                    <div class="field-error"
                         th:if="${#fields.hasErrors('numeroTuc')}"
                         th:errors="*{numeroTuc}">
                        Error TUC
                    </div>

                </div>


                <!-- =========================
                     VENCIMIENTO TUC
                     ========================= -->
                <div>

                    <label for="fechaVencimientoTuc">
                        Fecha de vencimiento TUC
                    </label>

                    <input id="fechaVencimientoTuc"
                           type="date"
                           th:field="*{fechaVencimientoTuc}">

                    <div class="field-error"
                         th:if="${#fields.hasErrors('fechaVencimientoTuc')}"
                         th:errors="*{fechaVencimientoTuc}">
                        Error fecha de vencimiento
                    </div>

                </div>


                <!-- =========================
                     ACCIONES
                     ========================= -->
                <div class="form-actions">

                    <a th:href="@{/vehiculos}"
                       class="secondary-button">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="primary-button"
                            th:text="${vehiculo.id == null
                                    ? 'Guardar vehículo'
                                    : 'Actualizar vehículo'}">

                        Guardar vehículo

                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

</body>

</html>
