<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vehículos | StockFlow</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"></head>
<body><div class="layout"><aside th:replace="~{fragments/sidebar :: sidebar('vehiculos')}"></aside><main class="main-content form-page"><header class="topbar"><div><span class="eyebrow">Registros / Vehículos</span><h1 th:text="${vehiculo.id == null ? 'Nuevo vehículo' : 'Editar vehículo'}"></h1></div><a class="text-link" th:href="@{/vehiculos}">Volver al listado</a></header>
<section class="panel"><form class="stack-form" th:action="@{/vehiculos/guardar}" th:object="${vehiculo}" method="post"><input type="hidden" th:field="*{id}"><input type="hidden" th:field="*{activo}">
<div class="error-message" role="alert" th:if="${#fields.hasAnyErrors()}"><p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p></div><fieldset class="form-section"><legend><span class="step-number">1</span>Datos del vehículo</legend><div class="field-grid"><div><label for="placa">Placa</label><input id="placa" type="text" th:field="*{placa}" maxlength="10" required><span class="field-error" th:errors="*{placa}"></span></div><div><label for="propietario">Propietario (opcional)</label><input id="propietario" type="text" th:field="*{propietario}" maxlength="120" placeholder="Nombre completo o razón social"><span class="field-error" th:errors="*{propietario}"></span></div><div><label for="marca">Marca</label><input id="marca" type="text" th:field="*{marca}" maxlength="60" required><span class="field-error" th:errors="*{marca}"></span></div><div><label for="modelo">Modelo</label><input id="modelo" type="text" th:field="*{modelo}" maxlength="60" required><span class="field-error" th:errors="*{modelo}"></span></div><div><label for="anio">Año</label><input id="anio" type="number" th:field="*{anio}" min="1980" max="2100" required><span class="field-error" th:errors="*{anio}"></span></div><div><label for="color">Color</label><input id="color" type="text" th:field="*{color}" maxlength="40" required><span class="field-error" th:errors="*{color}"></span></div><div><label for="capacidadPasajeros">Plazas para pasajeros</label><input id="capacidadPasajeros" type="number" th:field="*{capacidadPasajeros}" min="1" max="50" required><span class="field-error" th:errors="*{capacidadPasajeros}"></span></div></div></fieldset><fieldset class="form-section"><legend><span class="step-number">2</span>Tarjeta de circulación</legend><div class="field-grid"><div><label for="numeroTuc">Número TUC</label><input id="numeroTuc" type="text" th:field="*{numeroTuc}" maxlength="30" required><span class="field-error" th:errors="*{numeroTuc}"></span></div><div><label for="fechaVencimientoTuc">Vencimiento (opcional)</label><input id="fechaVencimientoTuc" type="date" th:field="*{fechaVencimientoTuc}" ><span class="field-error" th:errors="*{fechaVencimientoTuc}"></span></div></div></fieldset><div class="form-actions"><a class="secondary-button" th:href="@{/vehiculos}">Cancelar</a><button class="primary-button" type="submit">Guardar vehículo</button></div></form></section></main></div></body></html>
