<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vehículos | StockFlow</title><link rel="stylesheet" th:href="@{/css/dashboard.css}"></head>
<body><div class="layout"><aside th:replace="~{fragments/sidebar :: sidebar('vehiculos')}"></aside><main class="main-content"><header class="topbar"><div><span class="eyebrow">Registros</span><h1>Vehículos</h1></div><a class="primary-button" sec:authorize="hasAnyRole('ADMINISTRADOR','OPERATIVO')" th:href="@{/vehiculos/nuevo}">Nuevo vehículo</a></header><div class="success-message" role="status" th:if="${mensajeExito}" th:text="${mensajeExito}"></div><section class="panel"><div class="section-heading"><h2>Listado</h2><span class="muted" th:text="${#lists.size(vehiculos) + ' registro(s)'}"></span></div><div class="table-responsive"><table class="data-table"><thead><tr><th>Placa</th><th>Vehículo</th><th>Plazas</th><th>TUC</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="vehiculo : ${vehiculos}"><td data-label="Placa" class="vehicle-plate" th:text="${vehiculo.placa}"></td><td data-label="Vehículo"><span th:text="${vehiculo.marca + ' ' + vehiculo.modelo}"></span><small th:text="${vehiculo.anio + ' · ' + vehiculo.color}"></small></td><td data-label="Plazas" th:text="${vehiculo.capacidadPasajeros}"></td><td data-label="TUC"><span th:text="${vehiculo.numeroTuc}"></span><small th:text="${vehiculo.fechaVencimientoTuc != null ? 'Vence ' + #temporals.format(vehiculo.fechaVencimientoTuc, 'dd/MM/yyyy') : 'Sin vencimiento registrado'}"></small></td><td data-label="Estado"><span class="status-badge" th:classappend="${vehiculo.activo ? 'status-active' : 'status-muted'}" th:text="${vehiculo.activo ? 'Activo' : 'Inactivo'}"></span></td>
<td data-label="Acciones"><div class="action-buttons" sec:authorize="hasAnyRole('ADMINISTRADOR','OPERATIVO')"><a class="secondary-button" th:href="@{/vehiculos/editar/{id}(id=${vehiculo.id})}">Editar</a><form method="post" th:action="@{/vehiculos/estado/{id}(id=${vehiculo.id})}" data-confirmar-estado="¿Confirma el cambio de estado de este registro?"><button type="submit" th:class="${vehiculo.activo ? 'danger-button' : 'success-button'}" th:text="${vehiculo.activo ? 'Inactivar' : 'Activar'}"></button></form></div></td></tr>
<tr th:if="${#lists.isEmpty(vehiculos)}"><td colspan="6">Aún no hay registros.</td></tr></tbody></table></div></section></main></div></body></html>
