<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Vehículos | StockFlow</title>

    <link rel="stylesheet"
          th:href="@{/css/dashboard.css}">
</head>

<body>

<div class="layout">

    <!-- =========================
         MENÚ LATERAL
         ========================= -->
    <aside class="sidebar">

        <div class="brand">
            <h2>StockFlow</h2>
            <span>Honoria Express S.A.C.</span>
        </div>

        <nav class="menu">

            <a th:href="@{/}">
                Dashboard
            </a>

            <a th:href="@{/conductores}">
                Conductores
            </a>

            <a th:href="@{/vehiculos}"
               class="active">
                Vehículos
            </a>

            <a href="#">
                Turnos
            </a>

            <a href="#">
                Salidas
            </a>

            <a href="#">
                Encomiendas
            </a>

            <a href="#">
                Caja
            </a>

            <a href="#">
                Reportes
            </a>

        </nav>

    </aside>


    <!-- =========================
         CONTENIDO PRINCIPAL
         ========================= -->
    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>
                    Vehículos
                </h1>

                <p>
                    Gestión de vehículos registrados
                </p>

            </div>

            <a th:href="@{/vehiculos/nuevo}"
               class="primary-button">
                Nuevo vehículo
            </a>

        </header>


        <!-- =========================
             CONTENIDO DEL MÓDULO
             ========================= -->
        <section class="panel">

            <!-- MENSAJE DE ÉXITO -->
            <div th:if="${mensajeExito}"
                 th:text="${mensajeExito}"
                 style="
                    padding: 12px;
                    margin-bottom: 20px;
                    border: 1px solid green;
                    background-color: #e8f5e9;
                    font-weight: bold;
                 ">
            </div>


            <!-- =========================
                 TABLA DE VEHÍCULOS
                 ========================= -->
            <table class="data-table">

                <thead>

                <tr>
                    <th>Placa</th>
                    <th>Marca / Modelo</th>
                    <th>Año</th>
                    <th>Color</th>
                    <th>Capacidad</th>
                    <th>TUC</th>
                    <th>Vencimiento TUC</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>

                </thead>


                <tbody>

                <!-- RECORRE TODOS LOS VEHÍCULOS -->
                <tr th:each="vehiculo : ${vehiculos}">

                    <td th:text="${vehiculo.placa}">
                    </td>

                    <td th:text="${vehiculo.marca + ' ' + vehiculo.modelo}">
                    </td>

                    <td th:text="${vehiculo.anio}">
                    </td>

                    <td th:text="${vehiculo.color}">
                    </td>

                    <td th:text="${vehiculo.capacidadPasajeros}">
                    </td>

                    <td th:text="${vehiculo.numeroTuc}">
                    </td>

                    <td th:text="${vehiculo.fechaVencimientoTuc}">
                    </td>


                    <!-- ESTADO -->
                    <td>

                        <span th:class="${vehiculo.activo
                                ? 'status-badge status-active'
                                : 'status-badge status-inactive'}"
                              th:text="${vehiculo.activo
                                ? 'Activo'
                                : 'Inactivo'}">
                        </span>

                    </td>


                    <!-- ACCIONES -->
                    <td>

                        <div class="action-buttons">

                            <!-- EDITAR -->
                            <a th:href="@{/vehiculos/editar/{id}(id=${vehiculo.id})}"
                               class="secondary-button">
                                Editar
                            </a>


                            <!-- ACTIVAR / INACTIVAR -->
                            <form th:action="@{/vehiculos/estado/{id}(id=${vehiculo.id})}"
                                  method="post">

                                <button type="submit"
                                        th:class="${vehiculo.activo
                                                ? 'danger-button'
                                                : 'success-button'}"
                                        th:text="${vehiculo.activo
                                                ? 'Inactivar'
                                                : 'Activar'}">

                                    Cambiar estado

                                </button>

                            </form>

                        </div>

                    </td>

                </tr>


                <!-- SI NO HAY VEHÍCULOS -->
                <tr th:if="${#lists.isEmpty(vehiculos)}">

                    <td colspan="9">
                        No hay vehículos registrados.
                    </td>

                </tr>

                </tbody>

            </table>

        </section>

    </main>

</div>

</body>

</html>
