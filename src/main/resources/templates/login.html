<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | StockFlow</title>
</head>

<body>

    <main>

        <h1>StockFlow</h1>

        <p>
            Sistema Web para la Gestión Operativa y Administrativa
            de Honoria Express S.A.C.
        </p>

        <div th:if="${param.error}">
            Usuario o contraseña incorrectos.
        </div>

        <div th:if="${param.logout}">
            Sesión cerrada correctamente.
        </div>

        <form th:action="@{/login}" method="post">

            <div>
                <label for="username">
                    Usuario
                </label>

                <input
                        id="username"
                        name="username"
                        type="text"
                        required
                        autofocus>
            </div>

            <div>
                <label for="password">
                    Contraseña
                </label>

                <input
                        id="password"
                        name="password"
                        type="password"
                        required>
            </div>

            <button type="submit">
                Iniciar sesión
            </button>

        </form>

    </main>

</body>
</html>
