<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | StockFlow</title>

    <link rel="stylesheet"
          th:href="@{/css/dashboard.css}">
</head>

<body>

<main class="login-container">

    <section class="login-card" aria-labelledby="login-title">

        <div class="login-header">

            <h1>StockFlow</h1>

            <p>
                Honoria Express S.A.C.
            </p>

            <h2 id="login-title">Iniciar sesión</h2>
            <p>Ingresa con tu cuenta para continuar.</p>

        </div>


        <div class="login-message error-message"
             role="alert"
             th:if="${param.error}">
            Usuario o contraseña incorrectos.
        </div>


        <div class="login-message success-message"
             role="status"
             th:if="${param.logout}">
            Sesión cerrada correctamente.
        </div>


        <form th:action="@{/login}"
              method="post"
              class="login-form">

            <div class="form-group">

                <label for="username">
                    Usuario
                </label>

                <input id="username"
                       name="username"
                       type="text"
                       autocomplete="username"
                       autocapitalize="none"
                       spellcheck="false"
                       required
                       autofocus>

            </div>


            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <input id="password"
                       name="password"
                       type="password"
                       autocomplete="current-password"
                       required>

            </div>


            <button type="submit"
                    class="primary-button login-button">
                Iniciar sesión
            </button>

        </form>

    </section>

</main>

</body>
</html>
