<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${salida.id == null
        ? 'Registrar salida - StockFlow'
        : 'Editar salida - StockFlow'}">
        Salida - StockFlow
    </title>

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>

<div class="layout">

    <!-- MENÚ LATERAL -->
    <aside th:replace="~{fragments/sidebar :: sidebar('salidas')}"></aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">

        <header class="topbar">

            <div>

                <h1 th:text="${salida.id == null
                    ? 'Registrar salida'
                    : 'Editar salida'}">
                    Registrar salida
                </h1>

                <p>
                    Registro y actualización de la ejecución real
                    de un turno operativo.
                </p>

            </div>

        </header>

        <!-- PANEL DEL FORMULARIO -->
        <section class="panel">

            <form class="form-grid"
                  th:action="@{/salidas/guardar}"
                  th:object="${salida}"
                  method="post">

                <!--
                    Conserva el identificador durante una edición.
                    En una nueva salida permanecerá vacío.
                -->
                <input type="hidden"
                       th:field="*{id}">
                <div class="error-message" th:if="${#fields.hasAnyErrors()}">
                    <p th:each="error : ${#fields.allErrors()}" th:text="${error}"></p>
                </div>

                <!-- TURNO -->
                <div>

                    <label for="turno">
                        Vehículo y conductor
                    </label>

                    <select id="turno"
                            th:field="*{turno.id}"
                            required>

                        <option value="">
                            Seleccione un turno
                        </option>

                        <option th:each="turno : ${turnos}"
                                th:value="${turno.id}"
                                th:attr="data-ruta=${turno.sentidoRuta.name() == 'PUCALLPA_HONORIA' ? 'Pucallpa - Honoria' : 'Honoria - Pucallpa'},data-resumen=${'Orden ' + turno.numeroTurno + ' · ' + turno.fecha + ' · Capacidad: ' + turno.vehiculo.capacidadPasajeros},data-capacidad=${turno.vehiculo.capacidadPasajeros}"
                                th:text="${turno.vehiculo.placa + ' | ' + turno.conductor.nombres + ' ' + turno.conductor.apellidos}">
                        </option>

                    </select>

                    <small>Ordenados por llegada. Puede elegir cualquier vehículo pendiente.</small>
                    <small id="resumenTurno" aria-live="polite"></small>

                    <span class="field-error"
                          th:if="${#fields.hasErrors('turno')}"
                          th:errors="*{turno}">
                    </span>

                </div>

                <div>
                    <label for="rutaReal">Ruta</label>
                    <input id="rutaReal" type="text" th:field="*{rutaReal}"
                           list="rutasDisponibles" maxlength="120" required
                           placeholder="Seleccione o escriba una ruta" aria-describedby="rutaAyuda">
                    <datalist id="rutasDisponibles">
                        <option value="Pucallpa - Honoria"></option>
                        <option value="Honoria - Pucallpa"></option>
                    </datalist>
                    <small id="rutaAyuda">Elija una ruta o escriba otro destino.</small>
                    <span class="field-error" th:errors="*{rutaReal}"></span>
                </div>

                <!-- HORA REAL -->
                <div>

                    <label for="horaSalidaReal">
                        Hora real de salida
                    </label>

                    <input id="horaSalidaReal"
                           type="time"
                           th:field="*{horaSalidaReal}"
                           required>

                    <span class="field-error"
                          th:if="${#fields.hasErrors('horaSalidaReal')}"
                          th:errors="*{horaSalidaReal}">
                    </span>

                </div>

                <!-- PASAJEROS -->
                <div>

                    <label for="cantidadPasajeros">
                        Cantidad de pasajeros
                    </label>

                    <input id="cantidadPasajeros"
                           type="number"
                           min="0"
                           th:field="*{cantidadPasajeros}"
                           required>

                    <span class="field-error"
                          th:if="${#fields.hasErrors('cantidadPasajeros')}"
                          th:errors="*{cantidadPasajeros}">
                    </span>

                </div>

                <div>
                    <label>Cuota de agencia</label>
                    <strong th:text="${'S/ ' + (salida.id == null ? tarifaAgencia : (salida.cuotaAgencia != null ? salida.cuotaAgencia : '—'))}"></strong>
                    <label th:if="${salida.id == null}" for="pagoAlSalir">Pago de salida</label>
                    <select th:if="${salida.id == null}" id="pagoAlSalir" th:field="*{pagoAlSalir}">
                        <option value="false">Pendiente de pago — pagará al regreso</option>
                        <option value="true" sec:authorize="hasAnyRole('ADMINISTRADOR','CAJA')">Pagado — recibido al salir</option>
                    </select>
                    <small th:if="${salida.id != null}" th:text="${salida.estadoCuota != null ? salida.estadoCuota : 'Histórico: cuota no determinada'}"></small>
                </div>
                <input th:if="${salida.id == null}" type="hidden" name="estado" value="EN_RUTA">
                <!-- ESTADO -->
                <div th:if="${salida.id != null}">

                    <label for="estado">
                        Estado
                    </label>

                    <select th:if="${salida.id != null}" id="estado"
                            th:field="*{estado}"
                            required>

                        <option th:each="estado : ${estados}"
                                th:value="${estado}"
                                th:text="${estado}">
                        </option>

                    </select>

                    <span class="field-error"
                          th:if="${#fields.hasErrors('estado')}"
                          th:errors="*{estado}">
                    </span>

                </div>

                <!-- OBSERVACIÓN -->
                <div class="form-wide">

                    <label for="observacion">
                        Observación
                    </label>

                    <textarea id="observacion"
                              th:field="*{observacion}"
                              maxlength="250"
                              rows="4"
                              placeholder="Ingrese una observación si es necesario">
                    </textarea>

                    <span class="field-error"
                          th:if="${#fields.hasErrors('observacion')}"
                          th:errors="*{observacion}">
                    </span>

                </div>

                <!-- ACCIONES -->
                <div class="form-actions">

                    <a th:href="@{/salidas}"
                       class="secondary-button">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="primary-button" th:text="${salida.id == null ? 'Registrar salida' : 'Guardar cambios'}">
                        Registrar salida
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

<script th:src="@{/js/salida-formulario.js}" defer></script>
</body>
</html>
