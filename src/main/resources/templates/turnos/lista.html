<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Turnos | StockFlow</title>

    <link rel="stylesheet"
          th:href="@{/css/dashboard.css}">
</head>

<body>

<div class="layout">

    <!-- =========================
         MENÚ LATERAL
         ========================= -->
    <aside class="sidebar">

        <div class="brand">
            <h2>StockFlow</h2>
            <span>Honoria Express S.A.C.</span>
        </div>

        <nav class="menu">

            <a th:href="@{/}">
                Dashboard
            </a>

            <a th:href="@{/conductores}">
                Conductores
            </a>

            <a th:href="@{/vehiculos}">
                Vehículos
            </a>

            <a th:href="@{/turnos}"
               class="active">
                Turnos
            </a>

            <a href="#">
                Salidas
            </a>

            <a href="#">
                Encomiendas
            </a>

            <a href="#">
                Caja
            </a>

            <a href="#">
                Reportes
            </a>

        </nav>

    </aside>


    <!-- =========================
         CONTENIDO PRINCIPAL
         ========================= -->
    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>
                    Turnos
                </h1>

                <p>
                    Programación y asignación de turnos operativos
                </p>

            </div>

            <a th:href="@{/turnos/nuevo}"
               class="primary-button">
                Nuevo turno
            </a>

        </header>


        <!-- =========================
             CONTENIDO DEL MÓDULO
             ========================= -->
        <section class="panel">

            <!-- MENSAJE DE ÉXITO -->
            <div th:if="${mensajeExito}"
                 th:text="${mensajeExito}"
                 style="
                    padding: 12px;
                    margin-bottom: 20px;
                    border: 1px solid green;
                    background-color: #e8f5e9;
                    font-weight: bold;
                 ">
            </div>


            <!-- =========================
                 TABLA DE TURNOS
                 ========================= -->
            <table class="data-table">

                <thead>

                <tr>
                    <th>Fecha</th>
                    <th>N.º turno</th>
                    <th>Ruta</th>
                    <th>Hora</th>
                    <th>Conductor</th>
                    <th>Vehículo</th>
                    <th>Estado</th>
                    <th>Observación</th>
                    <th>Acciones</th>
                </tr>

                </thead>


                <tbody>

                <!-- RECORRE TODOS LOS TURNOS -->
                <tr th:each="turno : ${turnos}">

                    <td th:text="${turno.fecha}">
                    </td>

                    <td th:text="${turno.numeroTurno}">
                    </td>

                    <td th:text="${turno.sentidoRuta == T(pe.com.honoriaexpress.stockflow.entity.SentidoRuta).PUCALLPA_HONORIA
                            ? 'Pucallpa → Honoria'
                            : 'Honoria → Pucallpa'}">
                    </td>

                    <td th:text="${turno.horaProgramada}">
                    </td>

                    <td th:text="${turno.conductor.nombres + ' ' + turno.conductor.apellidos}">
                    </td>

                    <td th:text="${turno.vehiculo.placa}">
                    </td>

                    <td>
                        <span th:text="${turno.estado}">
                        </span>
                    </td>

                    <td th:text="${turno.observacion != null && !turno.observacion.isBlank()
                            ? turno.observacion
                            : '-'}">
                    </td>


                    <!-- ACCIONES -->
                    <td>

                        <div class="action-buttons">

                            <a th:href="@{/turnos/editar/{id}(id=${turno.id})}"
                               class="secondary-button">
                                Editar
                            </a>

                        </div>

                    </td>

                </tr>


                <!-- SI NO HAY TURNOS -->
                <tr th:if="${#lists.isEmpty(turnos)}">

                    <td colspan="9">
                        No hay turnos registrados.
                    </td>

                </tr>

                </tbody>

            </table>

        </section>

    </main>

</div>

</body>

</html>
